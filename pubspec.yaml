name: bugsaymis_mobile
description: "MyPisay — PSHS Caraga Region Campus Parent App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Secure local storage (token)
  flutter_secure_storage: ^9.2.4

  # Firebase push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Local notifications (show FCM in foreground)
  flutter_local_notifications: ^18.0.1

  # Navigation
  go_router: ^14.8.1

  # Barcode / QR scanner for linking children
  mobile_scanner: ^7.0.0

  # Typography
  google_fonts: ^6.2.1

  # Misc UI
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
