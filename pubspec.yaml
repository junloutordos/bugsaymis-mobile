name: atlasgo
description: "AtlasGo — PSHS Caraga Region Campus Parent & Student App"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP
  dio: ^5.8.0+1

  # Secure local storage (token)
  flutter_secure_storage: ^9.2.4

  # Firebase push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Local notifications (show FCM in foreground)
  flutter_local_notifications: ^18.0.1

  # Navigation
  go_router: ^14.8.1

  # Barcode / QR scanner for linking children
  mobile_scanner: ^7.0.0

  # Student sign-in with official PSHS-CRC Google account
  google_sign_in: ^6.3.0

  # Typography
  google_fonts: ^6.2.1

  # Misc UI
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Clearance PDF download + share
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # Lost & Found photo attachment (camera/gallery -> base64 JSON upload)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1A3557"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

flutter_native_splash:
  color: "#1A3557"
  image: assets/images/atlasgo_splash.png
  android_12:
    color: "#1A3557"
    image: assets/images/atlasgo_mark.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
